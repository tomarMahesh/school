name: school

# Keeps logs from slowly filling the server's disk: 5 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: school_portal
      MYSQL_USER: school
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Trimmed to fit a small (2 GB) server.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: mysql://school:${MYSQL_PASSWORD}@db:3306/school_portal?allowPublicKeyRetrieval=true
      UPLOAD_DIR: /data/uploads
      AUTH_TRUST_HOST: "true"
      # Dates and times shown to users are in Indian time, not server (UTC) time.
      TZ: Asia/Kolkata
    volumes:
      - uploads:/data/uploads
    # Healthy = the site answers and can reach the database (/api/health).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
